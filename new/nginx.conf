events {
    worker_connections 1024;
}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream codeserver {
        server codeserver:3000;
        keepalive 64;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;  # 新版 nginx 推荐的 http2 配置方式

        server_name my.service.com;

        ssl_certificate     /etc/nginx/certs/my.service.com.crt;
        ssl_certificate_key /etc/nginx/certs/my.service.com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # 超时配置
        proxy_connect_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_read_timeout 7200s;
        send_timeout 7200s;
        keepalive_timeout 7200s;

        location / {
            proxy_pass http://codeserver;
            
            # 基础代理头部
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket 必需
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            # 禁用缓冲
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}